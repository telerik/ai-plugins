name: Version Bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest

    concurrency:
      group: 'version-bump'
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full history so the push range can include multiple
          # commits, such as a PR merged with several commits.
          fetch-depth: 0
          # PAT token so the bot push can bypass branch protection rules.
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Setup Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        run: node ./scripts/version-bump.mjs ci
        env:
          VERSION_BUMP_BASE_SHA: ${{ github.event.before }}
          VERSION_BUMP_HEAD_SHA: ${{ github.sha }}

      - name: Create or update version bump PR
        run: |
          ./scripts/create-or-update-version-pr.sh \
            "chore/version-bump" \
            "chore(release): bump plugin versions"
        env:
          GH_TOKEN: ${{ github.token }}
