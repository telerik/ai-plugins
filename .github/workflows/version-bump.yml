name: Version Bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 2 so git diff-tree can compare HEAD against its parent.
          # PAT token so the bot push can bypass branch protection rules.
          fetch-depth: 2
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Setup Git
        run: |
          git config user.name  "kendo-bot"
          git config user.email "kendouiteam@progress.com"

      - name: Bump versions
        run: node ./scripts/version-bump.mjs ci

      - name: Commit and push version changes
        run: |
          # Stage only the version files
          find plugins -name "plugin.json" -path "*/.claude-plugin/*" -exec git add {} +
          git add .claude-plugin/marketplace.json

          # Skip if nothing changed (e.g. commit type didn't warrant a bump)
          if git diff --staged --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore(release): bump plugin versions [skip ci]"
          git pull --rebase && git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
